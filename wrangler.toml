name = "personal-mcp-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# routes = [
#   { pattern = "mcp.lokha.today", custom_domain = true }
# ]

[vars]
ENVIRONMENT = "production"
LOKHA_API_URL = "https://lokha.today"
LOKHA_API_KEY = "configured-via-secrets"
X402_NETWORK = "eip155:8453"
PAYMENT_RECIPIENT_ADDRESS = "0x3A3Ef81a74B222EEa9099D544665DF7F4b5B6c61"

[[services]]
binding = "LOKHA_SERVICE"
service = "lokha"

[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "personal-mcp-storage"
